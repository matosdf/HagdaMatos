<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redefinir senha | Hagda Matos</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1C1310">
  <link rel="icon" type="image/png" sizes="192x192" href="Fotos/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
  <main class="portal-shell">
    <section class="portal-card">
      <div class="brand">Hagda Matos<small>Área reservada</small></div>
      <h1>Redefinir senha</h1>
      <p>Escolha uma nova senha com pelo menos 12 caracteres.</p>
      <form id="password-form">
        <label>
          Nova senha
          <input type="password" name="password" autocomplete="new-password" minlength="12" required>
        </label>
        <label>
          Confirmar nova senha
          <input type="password" name="confirmation" autocomplete="new-password" minlength="12" required>
        </label>
        <button type="submit">Atualizar senha</button>
        <p id="password-status" class="status" role="status"></p>
      </form>
    </section>
  </main>
  <script src="assets/js/redefinir-senha.js" defer></script>
</body>
</html>
